name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/sitios?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"

      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Commit mensual (el dia 1 de cada mes)
        run: |
          d=$(date -u +%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$d" -le 3 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .actividad
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .actividad
            git commit -m "Mantener tareas activas [skip ci]" || echo "Sin cambios"
            git push || echo "No se pudo hacer push"
          fi
